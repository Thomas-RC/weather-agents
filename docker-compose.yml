services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: weather-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: weather-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.6
    container_name: weather-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: weather-phpmyadmin
    profiles: ["admin"]
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    container_name: weather-worker
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    env_file: [.env]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/sa-key.json
    volumes:
      - ${GOOGLE_SA_KEY_FILE:-./secrets/sa-key.json}:/gcp/sa-key.json:ro
    restart: unless-stopped

  adk-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    container_name: weather-adk-web
    profiles: ["dev"]
    ports:
      - "8002:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    env_file: [.env]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/sa-key.json
    volumes:
      - ${GOOGLE_SA_KEY_FILE:-./secrets/sa-key.json}:/gcp/sa-key.json:ro
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000", "src/agents"]
    restart: unless-stopped

volumes:
  mariadb_data:
